[pytest]
markers =
    gate: 质量门禁回归测试（P0/P1/P2 等交付硬阻塞修复）
    smoke: 冒烟测试
    integration: 集成测试
    regression: 回归测试
    parametrize: 参数化测试
    layer: 测试层级（execution/unit/integration）
    test_type: 测试类型（integration/negative/boundary）
    component: 被测组件（executor/ledger_agent/report_engine/conversation）
    risk_area: 风险域（execution-safety/data-integrity/intent-misclass/security）
    priority: 优先级（p0/p1/p2）
    suite: 所属测试套件（v1.0.0-direction-b 等）
